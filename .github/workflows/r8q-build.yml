name: Build Kernel r8q

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev zip zstd jq gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Build Kernel
        run: |
          chmod +x build-local.sh
          printf "r8q\nstock\n" | ./build-local.sh

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-r8q-ZIP
          path: "*.zip"
